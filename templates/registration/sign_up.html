{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <h2 class="text-center mb-4">{{ title }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success btn-block mt-3">Sign-Up</button>
  </form>
</div>
{% endblock %}
